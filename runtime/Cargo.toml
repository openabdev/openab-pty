[package]
name = "openab-pty"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/openabdev/openab-pty"
license = "MIT"
description = "OpenAB PTY runtime — remote sandboxed terminal sessions over WebSocket (internal, unpublished)"

[dependencies]
# DEFERRED: trimming `full` to the feature set actually used. The earlier note
# here said this crate "ships no image", which stopped being true when CI started
# building one -- but the conclusion survives on a better reason: the runtime is a
# few MB of static binary inside a ~700 MB agent base, so trimming features moves
# well under 1% of the image while costing a per-feature bisect that has to be
# redone as the crate changes. Revisit if the base ever gets slim, not before.
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
clap = { version = "4", features = ["derive"] }
subtle = "2"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
portable-pty = "0.9"
# Seeded-state extraction. No `zip`: see the deviations noted in runtime/src/seed.rs.
tar = "0.4"
flate2 = "1"
tempfile = "3"


[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio-tungstenite = "0.29"

[workspace]
