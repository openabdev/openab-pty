name: image

# Builds and publishes the runtime image to GHCR, one image per agent-CLI
# variant. The pre-implementation gate that previously kept this private
# (openabdev/openab#1479) was closed as superseded on 2026-08-20: Phase 1 had
# already been implemented, so the gate no longer governed the decision it
# existed to govern.
#
# Public images are not only an openness choice. They remove the registry pull
# secret entirely — the private-ECR token expired every 12 hours and had to be
# refreshed in every cluster before a deploy would pull.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: openabdev/openab-pty

jobs:
  # The image is built from whatever the tests ran against, not in parallel with
  # them. Publishing an artifact whose test result is still unknown is how a red
  # gate ends up shipping.
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Every agent CLI the openab base image ships a variant for, except
        # agentcore (excluded by decision). The base decides which agent CLI a
        # session lands next to; one openab-pty image per variant keeps that
        # adjacency: deploy openab-pty:pre-beta-claude and the terminal opens
        # beside claude, and so on.
        variant: [antigravity, claude, codex, copilot, cursor, devin, gemini,
                  grok, hermes, kiro, mimocode, native, opencode, pi]
    permissions:
      contents: read
      # Publishing to GHCR under the openabdev org needs this. It replaces the
      # id-token scope the old AWS OIDC path required.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Work out the tags and resolve the base digest
        id: meta
        run: |
          SHORT="$(git rev-parse --short HEAD)"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"

          # Channel mapping. Each openab-pty channel tracks the *same* channel of
          # the openab base, so the label never claims more stability than the
          # base it was built from:
          #
          #   main push  -> pre-beta-<variant>   FROM openab:pre-beta-<variant>
          #   v* tag     -> beta-<variant>       FROM openab:beta-<variant>
          #
          # There is deliberately no `stable` channel: openab publishes no
          # stable-* tag, so an openab-pty:stable-* would have nothing to track
          # and would be built from a pre-beta or beta base — a label that lies.
          # Add it here when, and only when, the base grows one.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            CHANNEL=beta
          else
            CHANNEL=pre-beta
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

          # Resolve the amd64 digest of the variant's base tag at build time.
          # Digest-pinning still holds — the digest is recorded in the job log
          # and baked into the provenance of this exact build, rather than the
          # tag silently re-resolving with nothing written down.
          T=$(curl -s "https://ghcr.io/token?scope=repository:openabdev/openab:pull&service=ghcr.io" | jq -r .token)
          DIGEST=$(curl -s -H "Authorization: Bearer $T" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/openabdev/openab/manifests/${CHANNEL}-${{ matrix.variant }}" \
            | jq -r '.manifests[]|select(.platform.architecture=="amd64").digest')
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            echo "FAIL: could not resolve digest for ${CHANNEL}-${{ matrix.variant }}" >&2
            exit 1
          fi
          echo "base_digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Resolved ${CHANNEL}-${{ matrix.variant }} -> $DIGEST"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Pull requests build but do not push. GITHUB_TOKEN is read-only on a fork
      # PR, so a fork could not push even if this workflow asked it to. The build
      # itself is still worth running — the base image and the musl link step are
      # where a break would show up.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push, off a pull request)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # linux/amd64 only. Both deployment targets are amd64, and an arm64 leg
          # would roughly double the build for nothing that currently runs.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            OPENAB_BASE_DIGEST=${{ steps.meta.outputs.base_digest }}
          # A moving channel tag for convenience plus an immutable one for
          # provenance. Deploying the moving tag alone makes "which code is
          # running" unanswerable after the fact.
          tags: ${{ github.event_name != 'pull_request' && format('{0}/{1}:{2}-{3},{0}/{1}:{3}-{4}', env.REGISTRY, env.IMAGE_NAME, steps.meta.outputs.channel, matrix.variant, steps.meta.outputs.short) || 'openab-pty:pr' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # Prove the thing starts and enforces its own contract, rather than
      # assuming a successful build means a working image. Both checks below have
      # failed for real reasons before: an entrypoint that could not find its
      # config, and a listener that refused to bind.
      - name: Smoke test the built image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.variant }}-${{ steps.meta.outputs.short }}
        run: |
          set -euo pipefail
          docker pull -q "$IMAGE"

          # 1. It must refuse to start without an admin credential hash, rather
          #    than coming up with authentication disabled.
          if docker run --rm "$IMAGE" --version >/dev/null 2>&1; then
            echo "FAIL: started with no PTY_ADMIN_HASH" >&2; exit 1
          fi
          echo "ok: refuses to start without PTY_ADMIN_HASH"

          CRED="$(openssl rand -hex 32)"
          HASH="sha256:$(printf '%s' "$CRED" | sha256sum | cut -d' ' -f1)"

          # 2. It must refuse an off-loopback bind while it holds no TLS key.
          if docker run --rm -e PTY_ADMIN_HASH="$HASH" -e PTY_LISTEN=0.0.0.0:8090 \
               "$IMAGE" >/dev/null 2>&1; then
            echo "FAIL: bound off-loopback with no TLS terminator" >&2; exit 1
          fi
          echo "ok: fail-closed listener guard holds"

          docker run -d --name pty --read-only --tmpfs /tmp --tmpfs /workspace \
            -e PTY_ADMIN_HASH="$HASH" "$IMAGE" >/dev/null
          for i in $(seq 1 20); do
            docker exec pty curl -sf -o /dev/null --max-time 2 \
              -H "Authorization: Bearer $CRED" http://127.0.0.1:8090/admin/sessions && break
            sleep 1
          done

          # 3. The admin plane must answer the credential and refuse its absence.
          docker exec pty curl -sf --max-time 5 -H "Authorization: Bearer $CRED" \
            http://127.0.0.1:8090/admin/sessions >/dev/null
          echo "ok: admin plane authenticates"
          CODE="$(docker exec pty curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
            http://127.0.0.1:8090/admin/sessions)"
          [ "$CODE" = "401" ] || { echo "FAIL: unauthenticated admin got $CODE, expected 401" >&2; exit 1; }
          echo "ok: unauthenticated admin request gets 401"

          # 4. The sandbox properties the ADR claims must actually hold.
          docker exec pty sh -c '[ "$(id -u)" = 1000 ]' || { echo "FAIL: not uid 1000" >&2; exit 1; }
          docker exec pty sh -c '! command -v sudo >/dev/null' || { echo "FAIL: sudo present" >&2; exit 1; }
          docker exec pty sh -c '! touch /probe 2>/dev/null' || { echo "FAIL: root filesystem writable" >&2; exit 1; }
          echo "ok: uid 1000, no sudo, read-only root filesystem"

          docker rm -f pty >/dev/null

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Image pushed"
            echo
            echo '```'
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.variant }}-${{ steps.meta.outputs.short }}"
            echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.channel }}-${{ matrix.variant }}"
            echo '```'
            echo
            echo "Public GHCR — no pull secret needed. Base: openab:${{ steps.meta.outputs.channel }}-${{ matrix.variant }} @ ${{ steps.meta.outputs.base_digest }}"
            echo
            echo "The image aggregates a third-party agent CLI under its vendor's terms; MIT covers this repository only. See NOTICE."
          } >> "$GITHUB_STEP_SUMMARY"
