apiVersion: ecsctl/v1
kind: Service
metadata:
  name: kiro-with-pty
  cluster: openab

# The adjacency shape: an OAB kiro agent and a terminal into the same workspace,
# in one task.
#
# This is what the PTY runtime exists for. The agent works in /workspace; you
# attach a terminal that is already in that directory, with the same tools, and
# can inspect or fix what the agent did without a second deployment, an SSH key,
# or a public port.
#
# Four containers, and the ordering matters:
#
#   init-perms  root, chowns the volumes, exits                   (essential: false)
#   tailscale   joins the tailnet, proxies to loopback             (essential: true)
#   openab      Discord bot: kiro-cli under the OAB broker         (essential: false)
#   openab-pty  terminal into the same /workspace                  (essential: true)
#
# `openab` is not essential on purpose: a bad or reset Discord token makes
# `openab run` exit 1, and that must not stop the task and its terminal. ECS
# does not restart a non-essential container, so the container restarts the
# broker itself with a backoff loop; switch to a container `restartPolicy` once
# ecsctl supports it (oablab/ecsctl#60).
#
# Both openab and openab-pty mount `workspace` -- and nothing else in common;
# each has its own /tmp. /workspace is the trust boundary to understand before
# deploying this: a terminal session can read and write anything the agent can,
# including config the agent's kiro-cli will execute, and vice versa. One trust
# zone, by design. See docs/colocated-openab.md.
#
# Replace: subnets, securityGroups, role ARN, secret ARNs, the Discord channel,
# and the tailscale hostname.
spec:
  # 2 vCPU / 4 GB: the agent and the terminal both run real workloads here, and
  # kiro-cli is not small. 1024/2048 is enough for pty alone, not for both.
  cpu: "2048"
  memory: "4096"
  arch: X86_64
  capacity: FARGATE
  desiredCount: 1

  subnets:
    - subnet-0564da5939b9f37e8
  securityGroups:
    - sg-0bc22bce7e98d79b0
  assignPublicIp: true

  executionRoleArn: "arn:aws:iam::123456789012:role/openab-pty-test-execution-role"
  # No taskRoleArn. A task role is task-wide: Fargate injects the credentials
  # URI into every container, and the trust note in docs/colocated-openab.md
  # explains how a session shell gets at what the bot's process can reach. A
  # Discord bot configured from env needs no AWS permissions at all (secrets are
  # resolved by the execution role at launch). If you add one -- an s3:// config,
  # S3 state -- treat every terminal session as holding it, and scope it to that.

  volumes:
    - name: workspace
    - name: pty-tmp
    - name: oab-tmp

  containers:
    - name: init-perms
      image: ghcr.io/openabdev/openab-pty:pre-beta-kiro
      essential: false
      user: "0"
      entryPoint: ["/bin/sh", "-c"]
      command:
        - "chown 1000:1000 /workspace /pty-tmp /oab-tmp && chmod 700 /workspace /pty-tmp /oab-tmp && echo 'volumes chowned to uid 1000'"
      mountPoints:
        /workspace: workspace
        /pty-tmp: pty-tmp
        /oab-tmp: oab-tmp
      logGroup: /ecs/kiro-with-pty

    - name: tailscale
      image: tailscale/tailscale:stable
      essential: true
      user: "0"
      entryPoint: ["/bin/sh", "-c"]
      command:
        - 'set -e; mkdir -p /tmp/tsstate; tailscaled --tun=userspace-networking --statedir=/tmp/tsstate --socket=/tmp/tailscaled.sock >/tmp/tailscaled.log 2>&1 & for i in $(seq 1 60); do [ -S /tmp/tailscaled.sock ] && break; sleep 1; done; tailscale --socket=/tmp/tailscaled.sock up --authkey="$TS_AUTHKEY" --hostname=kiro-with-pty --accept-dns=false; tailscale --socket=/tmp/tailscaled.sock ip -4; tail -f /tmp/tailscaled.log'
      secrets:
        TS_AUTHKEY: "arn:aws:secretsmanager:us-east-1:123456789012:secret:openab-pty/fargate-AbCdEf:TS_AUTHKEY::"
      logGroup: /ecs/kiro-with-pty

    # The agent. Runs from the openab-pty image with the entrypoint overridden,
    # so it has the same openab, the same kiro-cli, the same uid and HOME as the
    # terminal below -- one pull, no version skew. Hardened to the same level:
    # `openab run` needs nothing writable outside /workspace and its own /tmp
    # (verified, openab 0.10.0). It opens no listener: no [mcp] section and
    # OPENAB_ACP_ENABLED unset, because the tailscale sidecar forwards inbound
    # tailnet TCP to every loopback port in the task.
    - name: openab
      image: ghcr.io/openabdev/openab-pty:pre-beta-kiro
      essential: false
      user: "1000"
      readonlyRootFilesystem: true
      linuxParameters:
        capabilitiesDrop: ["ALL"]
      dependsOn:
        - containerName: init-perms
          condition: SUCCESS
      entryPoint: ["/usr/bin/tini", "-g", "--", "/bin/sh", "-c"]
      command:
        - |
          # ${DISCORD_BOT_TOKEN} inside the config stays literal here; openab expands it.
          # umask in a subshell only: kiro-cli inherits this shell's umask.
          (umask 077; printf '%s\n' "$OPENAB_CONFIG_TOML" > /tmp/openab.toml) || exit 1
          # The bot's own kiro agent; includeMcpJson=false keeps the terminal's
          # `computer` server out of bot sessions on images built before #76,
          # which put it in the shared ~/.kiro/settings/mcp.json, where it can
          # only answer 401. Removable once the images carry the #76 hook. See
          # pod-with-openab.yaml.
          mkdir -p "$HOME/.kiro/agents" || exit 1
          printf '%s\n' '{"name":"openab-bot","description":"Colocated openab broker agent (openab-pty#62)","tools":["*"],"allowedTools":["*"],"includeMcpJson":false}' > "$HOME/.kiro/agents/openab-bot.json" || exit 1
          # Restart with backoff until ecsctl can express a container restartPolicy (oablab/ecsctl#60).
          n=0
          while :; do
            openab run -c /tmp/openab.toml
            rc=$?
            n=$((n + 1))
            delay=$((n < 6 ? n * 5 : 30))
            echo "openab exited rc=$rc (attempt $n); restarting in ${delay}s" >&2
            sleep "$delay"
          done
      env:
        HOME: /workspace
        RUST_LOG: info
        # Out of /workspace, so a session shell cannot reach the control socket.
        OPENAB_AGENT_SOCKET: /tmp/openab-run/agent.sock
        # Non-secret: the token is referenced as ${DISCORD_BOT_TOKEN}, not embedded.
        OPENAB_CONFIG_TOML: |
          [discord]
          bot_token = "${DISCORD_BOT_TOKEN}"
          allowed_channels = ["REPLACE_WITH_CHANNEL_ID"]

          [agent]
          command = "kiro-cli"
          args = ["acp", "--trust-all-tools", "--agent", "openab-bot"]
          working_dir = "/workspace"

          [pool]
          max_sessions = 2
          session_ttl_hours = 24
      # The only platform secret, on this container alone -- never as a
      # PTY_FORWARD_* on openab-pty, which would put it in every session.
      secrets:
        DISCORD_BOT_TOKEN: "arn:aws:secretsmanager:us-east-1:123456789012:secret:openab/kiro-with-pty-XXXXXX:DISCORD_BOT_TOKEN::"
      mountPoints:
        /workspace: workspace
        /tmp: oab-tmp
      logGroup: /ecs/kiro-with-pty

    # The terminal: read-only root filesystem, no capabilities.
    - name: openab-pty
      image: ghcr.io/openabdev/openab-pty:pre-beta-kiro
      essential: true
      user: "1000"
      readonlyRootFilesystem: true
      linuxParameters:
        capabilitiesDrop: ["ALL"]
      dependsOn:
        - containerName: init-perms
          condition: SUCCESS
      env:
        PTY_LISTEN: 127.0.0.1:8090
        PTY_COMMAND: /usr/bin/bash
        HOME: /workspace
        PTY_MAX_SESSIONS: "3"
        PTY_ABSOLUTE_TTL: 12h
        PTY_IDLE_TTL: 8h
      secrets:
        PTY_ADMIN_HASH: "arn:aws:secretsmanager:us-east-1:123456789012:secret:openab-pty/fargate-AbCdEf:PTY_ADMIN_HASH::"
      mountPoints:
        /workspace: workspace
        /tmp: pty-tmp
      logGroup: /ecs/kiro-with-pty
