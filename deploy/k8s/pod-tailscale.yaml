# openab-pty with its own tailnet identity.
#
# What changes versus the hostPort version: the runtime binds **loopback only**
# and there is no hostPort on any interface. The single way in is the tailnet,
# through a userspace tailscaled sidecar that shares this pod's network
# namespace and forwards inbound connections to 127.0.0.1.
#
# Consequences, each deliberate:
#   - No LAN or host exposure. Previously two hostIPs were bound; now zero.
#   - The runtime's own fail-closed guard permits a loopback bind unconditionally,
#     so `tls_terminated_upstream` is false here and honest: nothing is served
#     off-loopback, and the encrypted hop is WireGuard rather than a claimed
#     upstream TLS terminator.
#   - The pod is its own tailnet node with its own identity and ACL scope. It does
#     not borrow p1's tailscale connection, so "can reach p1" no longer implies
#     "can reach this terminal".
#   - Userspace networking needs neither NET_ADMIN nor /dev/net/tun, so the ADR's
#     container contract (non-root, all capabilities dropped) survives intact for
#     both containers.
apiVersion: v1
kind: Pod
metadata:
  name: openab-pty
  namespace: openab-pty
  labels:
    app: openab-pty
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  containers:
    # ---------------------------------------------------------------- tailscale
    - name: tailscale
      image: tailscale/tailscale:stable
      imagePullPolicy: IfNotPresent
      env:
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef: { name: openab-pty-tailscale, key: authkey }
        # Userspace networking: no TUN device, no NET_ADMIN. Inbound connections
        # to this node's tailnet address are proxied to 127.0.0.1, which is
        # exactly the shape we want — the runtime never leaves loopback.
        - name: TS_USERSPACE
          value: "true"
        - name: TS_HOSTNAME
          value: "openab-pty"
        - name: TS_STATE_DIR
          value: /tmp/tsstate
        # containerboot defaults to storing tailscaled state in a Kubernetes
        # Secret, which needs a service-account token. We deliberately set
        # automountServiceAccountToken: false -- a session child being unable to
        # read a SA token is one of the sandbox properties this deployment
        # exists to demonstrate, and that setting is pod-level, so enabling it
        # for the sidecar would also hand one to the terminal container. Empty
        # value = use TS_STATE_DIR on disk instead.
        - name: TS_KUBE_SECRET
          value: ""
        - name: TS_EXTRA_ARGS
          # --accept-dns=false: this pod has no business rewriting its own
          # resolver, and MagicDNS is not needed for inbound.
          value: "--accept-dns=false"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests: { memory: 64Mi, cpu: 50m }
        limits: { memory: 192Mi, cpu: 500m }
      volumeMounts:
        - name: ts-state
          mountPath: /tmp/tsstate
        - name: ts-tmp
          mountPath: /tmp

    # --------------------------------------------------------------- openab-pty
    - name: openab-pty
      # The published image already contains the runtime binary and an entrypoint
      # that materialises config.toml from the PTY_* environment. Pick the variant
      # whose agent CLI you want; `native` carries none. See NOTICE for what the
      # image aggregates and under whose terms.
      image: ghcr.io/openabdev/openab-pty:pre-beta-kiro
      imagePullPolicy: IfNotPresent
      # No command/args override: the entrypoint validates the projection and
      # fails before serving if it is bad, which is more useful than a crash loop.
      env:
        # The only required variable. It is a non-reversible sha256 verifier, not
        # the credential — generate the pair with:
        #   docker run --rm --entrypoint /usr/local/bin/openab-pty \
        #     ghcr.io/openabdev/openab-pty:pre-beta-kiro --generate-admin-credential
        # Keep the credential in your client's keychain; only the hash goes here.
        - name: PTY_ADMIN_HASH
          valueFrom:
            secretKeyRef: { name: openab-pty, key: admin-hash }
        # Everything below has a default baked into the image; these are shown
        # because they are the ones worth deciding per deployment.
        - name: PTY_MAX_SESSIONS
          value: "3"
        - name: PTY_ABSOLUTE_TTL
          value: 12h
        - name: PTY_IDLE_TTL
          value: 8h
      # No ports block at all: nothing is published to the host. The listener
      # stays on 127.0.0.1:8090 and the sidecar above is the only way in.
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests: { memory: 128Mi, cpu: 100m }
        limits: { memory: 512Mi, cpu: "1" }
      volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: runtime-state
          mountPath: /run/openab-pty
        # The entrypoint writes config.toml under /tmp, so this is load-bearing
        # rather than hygiene: with a read-only root filesystem and no writable
        # /tmp the container cannot start.
        - name: tmp
          mountPath: /tmp

  volumes:
    - name: workspace
      emptyDir: {}
    - name: runtime-state
      emptyDir: { medium: Memory, sizeLimit: 16Mi }
    - name: tmp
      emptyDir: { sizeLimit: 512Mi }
    # tailscaled state. An ephemeral auth key means a replaced pod is removed
    # from the tailnet rather than accumulating dead nodes, which is the failure
    # the fleet already hit ("a new b0-N device per restart").
    - name: ts-state
      emptyDir: {}
    - name: ts-tmp
      emptyDir: {}
